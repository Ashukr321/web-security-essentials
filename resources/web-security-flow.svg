<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="380" fill="#0d1117"/>
  <text x="450" y="38" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Web Security: Three Trust Zones</text>
  <text x="450" y="62" fill="#8b949e" font-size="13" text-anchor="middle">Data crosses a trust boundary at every arrow — validate and authorize there</text>

  <!-- Frontend zone -->
  <rect x="40" y="110" width="220" height="200" rx="12" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="150" y="138" fill="#f78166" font-size="16" font-weight="700" text-anchor="middle">1 · Frontend</text>
  <text x="150" y="158" fill="#8b949e" font-size="11" text-anchor="middle">(Client / Browser)</text>
  <text x="150" y="190" fill="#e6edf3" font-size="12" text-anchor="middle">XSS (reflected/stored/DOM)</text>
  <text x="150" y="212" fill="#e6edf3" font-size="12" text-anchor="middle">CSP &amp; safe rendering</text>
  <text x="150" y="234" fill="#e6edf3" font-size="12" text-anchor="middle">Cookie flags</text>
  <text x="150" y="256" fill="#e6edf3" font-size="12" text-anchor="middle">HttpOnly · Secure</text>
  <text x="150" y="278" fill="#e6edf3" font-size="12" text-anchor="middle">SameSite</text>

  <!-- Transition zone -->
  <rect x="340" y="110" width="220" height="200" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="450" y="138" fill="#d29922" font-size="16" font-weight="700" text-anchor="middle">2 · In Transition</text>
  <text x="450" y="158" fill="#8b949e" font-size="11" text-anchor="middle">(Network)</text>
  <text x="450" y="190" fill="#e6edf3" font-size="12" text-anchor="middle">HTTPS &amp; HSTS</text>
  <text x="450" y="212" fill="#e6edf3" font-size="12" text-anchor="middle">CORS policy</text>
  <text x="450" y="234" fill="#e6edf3" font-size="12" text-anchor="middle">CSRF protection</text>
  <text x="450" y="266" fill="#8b949e" font-size="11" text-anchor="middle">forge · replay · intercept</text>

  <!-- Backend zone -->
  <rect x="640" y="110" width="220" height="200" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="750" y="138" fill="#3fb950" font-size="16" font-weight="700" text-anchor="middle">3 · Backend</text>
  <text x="750" y="158" fill="#8b949e" font-size="11" text-anchor="middle">(Server / Data)</text>
  <text x="750" y="190" fill="#e6edf3" font-size="12" text-anchor="middle">SQL injection defense</text>
  <text x="750" y="212" fill="#e6edf3" font-size="12" text-anchor="middle">Rate limiting</text>
  <text x="750" y="234" fill="#e6edf3" font-size="12" text-anchor="middle">Error handling</text>
  <text x="750" y="256" fill="#e6edf3" font-size="12" text-anchor="middle">Password hashing</text>
  <text x="750" y="278" fill="#e6edf3" font-size="12" text-anchor="middle">Never trust the client</text>

  <!-- Arrows -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <line x1="262" y1="185" x2="336" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="299" y="176" fill="#8b949e" font-size="10" text-anchor="middle">request</text>
  <line x1="562" y1="185" x2="636" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="599" y="176" fill="#8b949e" font-size="10" text-anchor="middle">request</text>
  <line x1="636" y1="235" x2="562" y2="235" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="336" y1="235" x2="262" y2="235" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="330" fill="#8b949e" font-size="11" text-anchor="middle">↔ response · Third-party / supply-chain risk spans all three zones</text>
</svg>
