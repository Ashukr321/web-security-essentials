<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="300" fill="#0d1117"/>
  <text x="380" y="36" fill="#d29922" font-size="20" font-weight="700" text-anchor="middle">2 · Sanitization</text>
  <text x="380" y="58" fill="#8b949e" font-size="12" text-anchor="middle">Clean the input — strip or neutralize the dangerous parts, keep the rest.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="30" y="105" width="210" height="80" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="135" y="132" fill="#e6edf3" font-size="12" text-anchor="middle">Untrusted HTML</text>
  <text x="135" y="153" fill="#f85149" font-size="11" text-anchor="middle">&lt;b&gt;Hi&lt;/b&gt;</text>
  <text x="135" y="171" fill="#f85149" font-size="11" text-anchor="middle">&lt;script&gt;steal()&lt;/script&gt;</text>

  <rect x="300" y="110" width="160" height="70" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="380" y="140" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">Sanitizer</text>
  <text x="380" y="162" fill="#8b949e" font-size="11" text-anchor="middle">e.g. DOMPurify</text>

  <rect x="520" y="105" width="210" height="80" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="625" y="132" fill="#e6edf3" font-size="12" text-anchor="middle">Safe HTML</text>
  <text x="625" y="153" fill="#3fb950" font-size="11" text-anchor="middle">&lt;b&gt;Hi&lt;/b&gt;</text>
  <text x="625" y="171" fill="#8b949e" font-size="11" text-anchor="middle">script removed</text>

  <line x1="242" y1="145" x2="296" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="462" y1="145" x2="516" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <text x="380" y="230" fill="#8b949e" font-size="12" text-anchor="middle">Use when you must ALLOW some rich content (comments, WYSIWYG) but not scripts.</text>
  <text x="380" y="252" fill="#8b949e" font-size="12" text-anchor="middle">Always use a vetted library with an allow-list — never a hand-rolled regex.</text>
  <text x="380" y="274" fill="#8b949e" font-size="12" text-anchor="middle">Sanitization MODIFIES the data; escaping (next) leaves it intact.</text>
</svg>
