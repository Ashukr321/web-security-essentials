<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="300" fill="#0d1117"/>
  <text x="380" y="36" fill="#58a6ff" font-size="20" font-weight="700" text-anchor="middle">1 · Validation</text>
  <text x="380" y="58" fill="#8b949e" font-size="12" text-anchor="middle">Is this input acceptable? — reject if it isn't. (Do it on input.)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="30" y="110" width="150" height="60" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="105" y="138" fill="#e6edf3" font-size="13" text-anchor="middle">Raw input</text>
  <text x="105" y="156" fill="#8b949e" font-size="11" text-anchor="middle">"age = 30"</text>

  <rect x="290" y="95" width="180" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="380" y="125" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">Check the rules</text>
  <text x="380" y="147" fill="#e6edf3" font-size="11" text-anchor="middle">type · length · range</text>
  <text x="380" y="165" fill="#e6edf3" font-size="11" text-anchor="middle">format · allow-list</text>

  <rect x="580" y="70" width="150" height="55" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="655" y="95" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">Accept ✓</text>
  <text x="655" y="113" fill="#8b949e" font-size="11" text-anchor="middle">pass downstream</text>

  <rect x="580" y="160" width="150" height="55" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="655" y="185" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">Reject ✗</text>
  <text x="655" y="203" fill="#8b949e" font-size="11" text-anchor="middle">error, don't store</text>

  <line x1="182" y1="140" x2="286" y2="140" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="472" y1="125" x2="576" y2="100" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="472" y1="155" x2="576" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <text x="380" y="250" fill="#8b949e" font-size="12" text-anchor="middle">Prefer allow-lists ("only these are valid") over deny-lists ("block these").</text>
  <text x="380" y="272" fill="#8b949e" font-size="12" text-anchor="middle">Validation decides IF data is allowed — it does not make bad data safe.</text>
</svg>
