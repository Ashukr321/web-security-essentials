<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="470" fill="#0d1117"/>
  <text x="460" y="34" fill="#f78166" font-size="22" font-weight="700" text-anchor="middle">Stored XSS (Persistent)</text>
  <text x="460" y="56" fill="#8b949e" font-size="13" text-anchor="middle">Payload is saved on the server and served to every visitor — the most dangerous variant.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f78166"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/></marker>
    <g id="person">
      <circle cx="0" cy="-16" r="12"/>
      <path d="M-18,20 Q-18,-2 0,-2 Q18,-2 18,20 Z"/>
    </g>
  </defs>

  <!-- Attacker -->
  <use href="#person" transform="translate(70,110)" fill="#f85149"/>
  <text x="70" y="150" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">Attacker</text>

  <!-- Server + DB -->
  <rect x="380" y="80" width="160" height="90" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="460" y="112" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">Server</text>
  <text x="460" y="134" fill="#8b949e" font-size="11" text-anchor="middle">comment API</text>
  <text x="460" y="151" fill="#8b949e" font-size="11" text-anchor="middle">(no sanitizing)</text>

  <path d="M540 125 h60" stroke="#8b949e" stroke-width="2" marker-end="url(#g)"/>
  <rect x="610" y="85" width="120" height="80" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="670" y="118" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">Database</text>
  <text x="670" y="140" fill="#f85149" font-size="10" text-anchor="middle">stores payload</text>

  <!-- Step 1: attacker posts payload -->
  <path d="M92,108 Q230,90 376,110" fill="none" stroke="#f78166" stroke-width="2" marker-end="url(#a)"/>
  <text x="140" y="86" fill="#f78166" font-size="11">1 · Posts a malicious comment</text>
  <rect x="150" y="182" width="470" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="162" y="200" fill="#e6edf3" font-size="11" font-family="Consolas, monospace">POST /comments   body: &lt;script&gt;steal(document.cookie)&lt;/script&gt;</text>

  <!-- Victims -->
  <use href="#person" transform="translate(120,360)" fill="#58a6ff"/>
  <use href="#person" transform="translate(180,360)" fill="#58a6ff"/>
  <use href="#person" transform="translate(240,360)" fill="#58a6ff"/>
  <text x="180" y="400" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">Every visitor</text>

  <!-- Step 2: victims load page -->
  <path d="M290,350 Q420,300 455,172" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#g)"/>
  <text x="330" y="290" fill="#8b949e" font-size="11">2 · Open the page</text>

  <!-- Step 3: server serves stored payload -->
  <path d="M600,150 Q560,300 300,350" fill="none" stroke="#f78166" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
  <text x="470" y="300" fill="#f78166" font-size="11">3 · Server returns the stored script to each of them</text>

  <!-- Step 4 -->
  <rect x="430" y="345" width="450" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="655" y="372" fill="#f85149" font-size="12" font-weight="700" text-anchor="middle">4 · Script runs in every visitor's browser</text>
  <text x="655" y="392" fill="#8b949e" font-size="11" text-anchor="middle">mass session theft — no per-victim link needed</text>
  <text x="655" y="408" fill="#8b949e" font-size="10" text-anchor="middle">Fix: sanitize on store · escape on output · CSP</text>
</svg>
