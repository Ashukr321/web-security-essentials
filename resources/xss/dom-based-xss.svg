<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="500" fill="#0d1117"/>
  <text x="500" y="34" fill="#f78166" font-size="22" font-weight="700" text-anchor="middle">DOM-Based XSS</text>
  <text x="500" y="55" fill="#8b949e" font-size="13" text-anchor="middle">Vulnerable client-side JavaScript writes attacker input into the page — the payload never reaches the server.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f78166"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/></marker>
    <g id="person">
      <circle cx="0" cy="-16" r="12"/>
      <path d="M-18,20 Q-18,-2 0,-2 Q18,-2 18,20 Z"/>
    </g>
  </defs>

  <!-- ===== main flow line: everything sits on y=150 ===== -->

  <!-- Attacker -->
  <use href="#person" transform="translate(70,150)" fill="#f85149"/>
  <text x="70" y="192" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">Attacker</text>

  <!-- arrow 1 -->
  <text x="150" y="132" fill="#f78166" font-size="11" text-anchor="middle">1 · sends link</text>
  <line x1="92" y1="150" x2="188" y2="150" stroke="#f78166" stroke-width="2" marker-end="url(#a)"/>

  <!-- Victim -->
  <use href="#person" transform="translate(212,150)" fill="#58a6ff"/>
  <text x="212" y="192" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">Victim</text>

  <!-- arrow 2 -->
  <text x="278" y="132" fill="#8b949e" font-size="11" text-anchor="middle">2 · opens</text>
  <line x1="234" y1="150" x2="316" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#g)"/>

  <!-- Browser box -->
  <rect x="320" y="88" width="420" height="212" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="530" y="114" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">Victim's Browser (DOM)</text>

  <rect x="338" y="130" width="384" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="352" y="150" fill="#8b949e" font-size="10.5" font-family="Consolas, monospace">// SINK — the page's own code</text>
  <text x="352" y="171" fill="#e6edf3" font-size="10.5" font-family="Consolas, monospace">el.innerHTML = location.hash.slice(1)</text>

  <rect x="338" y="194" width="384" height="52" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="352" y="214" fill="#8b949e" font-size="10.5" font-family="Consolas, monospace">// SOURCE — attacker-controlled fragment</text>
  <text x="352" y="235" fill="#f85149" font-size="10.5" font-family="Consolas, monospace">location.hash = "#&lt;img src=x onerror=steal()&gt;"</text>

  <text x="530" y="278" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">SOURCE flows into SINK → script executes</text>

  <!-- arrow 3: browser -> server, dashed & blocked -->
  <text x="765" y="128" fill="#8b949e" font-size="11" text-anchor="middle">3 · stays client-side</text>
  <line x1="742" y1="150" x2="786" y2="150" stroke="#8b949e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#g)"/>
  <text x="764" y="146" fill="#f85149" font-size="16" font-weight="700" text-anchor="middle">✗</text>

  <!-- Server (not involved) -->
  <rect x="790" y="115" width="185" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="882" y="145" fill="#8b949e" font-size="14" font-weight="700" text-anchor="middle">Server</text>
  <text x="882" y="166" fill="#6e7681" font-size="10.5" text-anchor="middle">never sees the payload</text>

  <!-- ===== explanation ===== -->
  <text x="500" y="352" fill="#8b949e" font-size="12" text-anchor="middle">The value flows from a client-side SOURCE (location.hash) into a dangerous SINK (innerHTML)</text>
  <text x="500" y="372" fill="#8b949e" font-size="12" text-anchor="middle">without ever reaching the server — so server-side filtering can never catch it.</text>

  <rect x="180" y="398" width="640" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="422" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">Fix</text>
  <text x="500" y="444" fill="#e6edf3" font-size="11.5" text-anchor="middle">Write with textContent (not innerHTML) · sanitize with DOMPurify · avoid eval / document.write</text>
</svg>
