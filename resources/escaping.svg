<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="320" fill="#0d1117"/>
  <text x="380" y="36" fill="#3fb950" font-size="20" font-weight="700" text-anchor="middle">3 · Escaping (Output Encoding)</text>
  <text x="380" y="58" fill="#8b949e" font-size="12" text-anchor="middle">Neutralize data for the context it lands in — at the moment of output.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="30" y="95" width="180" height="70" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="120" y="122" fill="#e6edf3" font-size="12" text-anchor="middle">Stored value</text>
  <text x="120" y="144" fill="#f85149" font-size="12" text-anchor="middle">&lt;script&gt;</text>

  <rect x="290" y="80" width="180" height="100" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="380" y="108" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">Encode per context</text>
  <text x="380" y="130" fill="#8b949e" font-size="11" text-anchor="middle">HTML body</text>
  <text x="380" y="147" fill="#8b949e" font-size="11" text-anchor="middle">attribute · JS · URL</text>
  <text x="380" y="164" fill="#8b949e" font-size="11" text-anchor="middle">CSS</text>

  <rect x="550" y="95" width="180" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="640" y="122" fill="#e6edf3" font-size="12" text-anchor="middle">Rendered as TEXT</text>
  <text x="640" y="144" fill="#3fb950" font-size="12" text-anchor="middle">&amp;lt;script&amp;gt;</text>

  <line x1="212" y1="130" x2="286" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="472" y1="130" x2="546" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <text x="380" y="215" fill="#e6edf3" font-size="12" text-anchor="middle">Same data, different encoding per output context:</text>
  <g font-size="11">
    <text x="120" y="245" fill="#8b949e">HTML:</text><text x="200" y="245" fill="#e6edf3">&amp;lt; &amp;gt; &amp;amp;</text>
    <text x="120" y="267" fill="#8b949e">Attribute:</text><text x="200" y="267" fill="#e6edf3">&amp;quot; &amp;#39;</text>
    <text x="480" y="245" fill="#8b949e">URL:</text><text x="560" y="245" fill="#e6edf3">%3C %3E</text>
    <text x="480" y="267" fill="#8b949e">JS string:</text><text x="560" y="267" fill="#e6edf3">\x3c \x3e</text>
  </g>
  <text x="380" y="300" fill="#8b949e" font-size="12" text-anchor="middle">The browser displays the characters instead of executing them. Data is never altered at rest.</text>
</svg>
